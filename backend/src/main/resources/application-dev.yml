# ===================================================================
# 社区物品租用平台 · 开发环境（本机真值，勿替换为占位符）
# 库名固定 rental；账号密码见 PROJECT_RULES.md §3
# ===================================================================
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/rental?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password: 123456
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      keep-alive: true
      # wall 会误拦多表 UPDATE ... JOIN，先不启用（PROJECT_RULES.md §4.8 D6）
      filters: stat,slf4j
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: admin
        login-password: druid123
        allow: 127.0.0.1
        reset-enable: false
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.css,/druid/*"
      filter:
        slf4j:
          enabled: true
          statement-executable-sql-log-enable: true

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms

# JWT：HS256 要求密钥 >= 32 字节
# access 120 分钟（短：泄露窗口小，前端靠 refresh 静默续期）
# refresh 7 天（长：避免频繁登录；服务端白名单 auth:refresh:{userId} 可随时吊销）
jwt:
  secret: rental-platform-jwt-secret-key-2026-please-change-before-production
  expire-minutes: 120
  refresh-expire-days: 7

# 文件存储（基础设施配置，不进策略表；PROJECT_RULES.md §9）
# max-size-mb 必须与 spring.servlet.multipart.max-file-size 保持一致
file:
  root: C:/Users/duyikang/Desktop/社区物品租用平台/uploads
  access-path: /uploads
  max-size-mb: 5
  allowed-ext: jpg,jpeg,png,webp
