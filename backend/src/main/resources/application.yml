# ===================================================================
# 社区物品租用平台 · 通用配置
# 约定：环境相关（数据源、Redis、密钥）只写在 application-dev.yml
# ===================================================================
server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: community-rental
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
    serialization:
      # Long 转字符串，防止前端 JS 精度丢失（PROJECT_RULES.md §6）
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.duyikang.rental.**.entity
  configuration:
    map-underscore-to-camel-case: true
    # 生产不要开，排查 SQL 时临时改成 StdOutImpl
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    root: info
    com.duyikang.rental: debug
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId}] %logger{40} - %msg%n"
